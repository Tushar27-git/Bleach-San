id = "windows_temp"
name = "Windows System Temp"
category = "system"
description = "Temporary files generated by Windows operating system services."
safety = "Safe"

[[targets]]
path = "%SYSTEMROOT%\\Temp"
action = "DeleteContents"
allowed_root = "%SYSTEMROOT%\\Temp"

[[targets]]
path = "C:\\Temp"
action = "DeleteContents"
allowed_root = "C:\\Temp"

[requirements]
requires_admin = true
