id = "windows_old"
name = "Previous Windows Installations (Windows.old)"
category = "system"
description = "Large leftover folders from previous Windows updates."
safety = "Review"

[[targets]]
path = "C:\\Windows.old"
action = "DeleteDirectory"
allowed_root = "C:\\Windows.old"

[[targets]]
path = "C:\\$Windows.~BT"
action = "DeleteDirectory"
allowed_root = "C:\\$Windows.~BT"

[[targets]]
path = "C:\\$Windows.~WS"
action = "DeleteDirectory"
allowed_root = "C:\\$Windows.~WS"

[requirements]
requires_admin = true
