id = "recent_items"
name = "Windows Recent Items"
category = "system"
description = "Shortcuts to recently accessed files and folders."
safety = "Safe"

[[targets]]
path = "%APPDATA%\\Microsoft\\Windows\\Recent"
action = "DeleteFilesMatching"
pattern = "*.lnk"
allowed_root = "%APPDATA%\\Microsoft\\Windows\\Recent"
exclude = ["AutomaticDestinations", "CustomDestinations"]

[requirements]
requires_admin = false
