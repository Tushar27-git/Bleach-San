id = "windows_logs"
name = "Windows Event Trace Logs"
category = "system"
description = "System log files (*.log, *.etl) generated by Windows components."
safety = "Safe"

[[targets]]
path = "%SYSTEMROOT%\\Logs"
action = "DeleteContents"
allowed_root = "%SYSTEMROOT%\\Logs"

[requirements]
requires_admin = true
