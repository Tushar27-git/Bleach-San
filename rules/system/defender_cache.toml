id = "defender_cache"
name = "Microsoft Defender Scan History & Logs"
category = "system"
description = "Historical threat scan results, diagnostic logs, and support dumps for Microsoft Defender Antivirus."
safety = "Safe"

[[targets]]
path = "%PROGRAMDATA%\\Microsoft\\Windows Defender\\Scans\\History\\Store"
action = "DeleteContents"
allowed_root = "%PROGRAMDATA%\\Microsoft\\Windows Defender\\Scans\\History"

[[targets]]
path = "%PROGRAMDATA%\\Microsoft\\Windows Defender\\Scans\\History\\Results"
action = "DeleteContents"
allowed_root = "%PROGRAMDATA%\\Microsoft\\Windows Defender\\Scans\\History"

[[targets]]
path = "%PROGRAMDATA%\\Microsoft\\Windows Defender\\Support"
action = "DeleteContents"
allowed_root = "%PROGRAMDATA%\\Microsoft\\Windows Defender"

[requirements]
requires_admin = true
