type = "glob"
pattern = "D:\\*\\*\\.vs"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "C:\\Users\\tusha\\source\\repos\\*\\.vs"

[requirements]
