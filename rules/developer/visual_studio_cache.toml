id = "visual_studio_cache"
name = "Visual Studio & C++ Build Cache"
category = "developer"
description = "Visual Studio (.vs) workspace cache, CMake build caches, and vcpkg archives."
safety = "Safe"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "D:\\*\\.vs"

