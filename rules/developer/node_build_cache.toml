id = "node_build_cache"
name = "Node.js & Web Build Cache"
category = "developer"
description = "Cached webpack, babel, vite, next.js, and turbo build artifacts across projects."
safety = "Safe"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "D:\\*\\.next"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "D:\\*\\*\\.next"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "C:\\Users\\tusha\\Desktop\\*\\*\\.next"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "C:\\Users\\tusha\\Downloads\\*\\*\\.next"

[[targets]]
path = "C:\\Users\\tusha\\.cache"
action = "DeleteContents"

[requirements]
requires_admin = false
process_closed = "node.exe"
