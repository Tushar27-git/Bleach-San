id = "cargo_cache"
name = "Cargo Package Cache (crates.io)"
category = "developer"
description = "Cached downloaded Rust crate tarballs (.crate files) and git checkout metadata from crates.io."
safety = "Safe"

[[targets]]
path = "%USERPROFILE%\\.cargo\\registry\\cache"
action = "DeleteContents"
allowed_root = "%USERPROFILE%\\.cargo\\registry\\cache"

[[targets]]
path = "%USERPROFILE%\\.cargo\\git\\checkouts"
action = "DeleteContents"
allowed_root = "%USERPROFILE%\\.cargo\\git\\checkouts"

[requirements]
requires_admin = false
