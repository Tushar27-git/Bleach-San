id = "adobe_cache"
name = "Adobe Cache"
category = "Applications"
description = "Common temporary and media cache files generated by Adobe products."
safety = "SAFE"

[targets]
directories = [
    "%APPDATA%\\Adobe\\Common\\Media Cache Files",
    "%APPDATA%\\Adobe\\Common\\Media Cache",
    "%LOCALAPPDATA%\\Adobe\\CameraRaw\\Cache"
]

[requirements]
requires_admin = false
