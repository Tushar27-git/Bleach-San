id = "adobe_cache"
name = "Adobe Cache"
category = "applications"
description = "Common temporary and media cache files generated by Adobe products."
safety = "Safe"

[[targets]]
path = "%APPDATA%\\Adobe\\Common\\Media Cache Files"
action = "DeleteContents"
allowed_root = "%APPDATA%\\Adobe"

[[targets]]
path = "%APPDATA%\\Adobe\\Common\\Media Cache"
action = "DeleteContents"
allowed_root = "%APPDATA%\\Adobe"

[[targets]]
path = "%LOCALAPPDATA%\\Adobe\\CameraRaw\\Cache"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Adobe"

[requirements]
process_closed = "Adobe Desktop Service.exe, Photoshop.exe, Premiere Pro.exe, AfterFX.exe, Illustrator.exe"
requires_admin = false
