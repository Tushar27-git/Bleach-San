id = "steam"
name = "Steam Web & Shader Cache"
category = "applications"
description = "Steam client embedded browser cache (CEF/Chromium) and shader depot pre-compilations."
safety = "Safe"

# Steam's CEF browser cache — entire htmlcache folder contents
[[targets]]
path = "%LOCALAPPDATA%\\Steam\\htmlcache"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Steam\\htmlcache"

# Steam's appcache (temporary data for the client)
[[targets]]
path = "C:\\Program Files (x86)\\Steam\\appcache"
action = "DeleteContents"
allowed_root = "C:\\Program Files (x86)\\Steam\\appcache"

[requirements]
process_closed = "steam.exe"
requires_admin = false
