id = "game_shader_cache"
name = "Game Shader & Engine Cache"
category = "applications"
description = "Compiled graphics shaders for Steam, Epic, and standalone games to prevent stutter."
safety = "Review"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "%LOCALAPPDATA%\\*\\Saved\\*\\*Cache"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "C:\\ProgramData\\*\\*Cache"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "C:\\Program Files (x86)\\Steam\\steamapps\\common\\*\\*Cache"

[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "glob"
pattern = "%APPDATA%\\*\\*Cache"

[requirements]
requires_admin = false
