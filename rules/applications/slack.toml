id = "slack_cache"
name = "Slack Cache"
category = "Applications"
description = "Temporary cache files generated by the Slack desktop app."
safety = "SAFE"

[targets]
directories = [
    "%APPDATA%\\Slack\\Cache",
    "%APPDATA%\\Slack\\Code Cache",
    "%APPDATA%\\Slack\\GPUCache"
]

[requirements]
requires_admin = false
