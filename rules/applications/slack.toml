id = "slack"
name = "Slack Cache"
category = "applications"
description = "Temporary cache, code cache, and GPU cache generated by the Slack desktop app."
safety = "Safe"

[[targets]]
path = "%APPDATA%\\Slack\\Cache\\Cache_Data"
action = "DeleteContents"
allowed_root = "%APPDATA%\\Slack\\Cache"

[[targets]]
path = "%APPDATA%\\Slack\\Code Cache"
action = "DeleteContents"
allowed_root = "%APPDATA%\\Slack\\Code Cache"

[[targets]]
path = "%APPDATA%\\Slack\\GPUCache"
action = "DeleteContents"
allowed_root = "%APPDATA%\\Slack\\GPUCache"

[requirements]
process_closed = "slack.exe"
requires_admin = false
