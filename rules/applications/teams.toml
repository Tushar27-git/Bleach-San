id = "teams"
name = "Microsoft Teams Cache"
category = "applications"
description = "Temporary cache, code cache, and GPU cache generated by Microsoft Teams."
safety = "Safe"

[[targets]]
path = "%LOCALAPPDATA%\\Packages\\MSTeams_8wekyb3d8bbwe\\LocalCache\\Microsoft\\MSTeams"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\MSTeams_8wekyb3d8bbwe"

[[targets]]
path = "%APPDATA%\\Microsoft\\Teams\\Cache"
action = "DeleteContents"
allowed_root = "%APPDATA%\\Microsoft\\Teams"

[[targets]]
path = "%APPDATA%\\Microsoft\\Teams\\Code Cache"
action = "DeleteContents"
allowed_root = "%APPDATA%\\Microsoft\\Teams"

[[targets]]
path = "%APPDATA%\\Microsoft\\Teams\\GPUCache"
action = "DeleteContents"
allowed_root = "%APPDATA%\\Microsoft\\Teams"

[requirements]
process_closed = "ms-teams.exe, Teams.exe, msteams.exe"
requires_admin = false
