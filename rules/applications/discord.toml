id = "discord"
name = "Discord Cache"
category = "applications"
description = "Cached media, GPU cache, and Code Cache generated by Discord."
safety = "Safe"

[[targets]]
path = "%APPDATA%\\discord\\Cache\\Cache_Data"
action = "DeleteContents"
allowed_root = "%APPDATA%\\discord\\Cache"

[[targets]]
path = "%APPDATA%\\discord\\Code Cache"
action = "DeleteContents"
allowed_root = "%APPDATA%\\discord\\Code Cache"

[[targets]]
path = "%APPDATA%\\discord\\GPUCache"
action = "DeleteContents"
allowed_root = "%APPDATA%\\discord\\GPUCache"

[requirements]
process_closed = "Discord.exe, DiscordCanary.exe, DiscordPTB.exe, DiscordDevelopment.exe"
requires_admin = false
