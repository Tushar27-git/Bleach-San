id = "spotify"
name = "Spotify Cache"
category = "applications"
description = "Cached music streaming data, browser UI cache, and offline content for the Microsoft Store version of Spotify."
safety = "Safe"

# Classic Win32 install paths (older installs)
[[targets]]
path = "%LOCALAPPDATA%\\Spotify\\Data"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Spotify\\Data"

[[targets]]
path = "%LOCALAPPDATA%\\Spotify\\Storage"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Spotify\\Storage"

# Microsoft Store (UWP) install — LocalCache holds ALL browser + song cache (~600 MB+)
[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Data"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Data"

[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Browser"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Browser"

[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\prefs"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\prefs"

# LocalState storage index (tiny but part of cache metadata)
[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalState\\Spotify\\Storage"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalState\\Spotify\\Storage"

[requirements]
process_closed = "Spotify.exe"
requires_admin = false
