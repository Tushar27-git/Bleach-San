id = "spotify"
name = "Spotify Cache"
category = "applications"
description = "Cached music streaming data, audio offline files, browser UI cache, and shader caches for Spotify."
safety = "Safe"

# 1. UWP / Store Spotify Audio Stream Data Cache (1GB+ audio cache)
[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Data"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"

# 2. UWP / Store Spotify Browser & Web Cache
[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Browser"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"

[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Default\\Cache"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"

[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Default\\Code Cache"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"

[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Default\\GPUCache"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"

# 3. UWP / Store Spotify Shaders & Offline Storage
[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\ShaderCache"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"

[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\GrShaderCache"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"

[[targets]]
path = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalState\\Spotify\\Storage"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"

# 4. Standard Win32 Desktop Spotify Caches
[[targets]]
path = "%LOCALAPPDATA%\\Spotify\\Data"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Spotify"

[[targets]]
path = "%LOCALAPPDATA%\\Spotify\\Browser"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Spotify"

[[targets]]
path = "%LOCALAPPDATA%\\Spotify\\Storage"
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Spotify"

# 5. Dynamic configured custom storage path from prefs
[[targets]]
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"
[targets.discovery]
type = "config"
file = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalState\\Spotify\\prefs"
format = "prefs"
key = "storage.last-location"
fallback = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalState\\Spotify\\Storage"

[[targets]]
action = "DeleteContents"
allowed_root = "%LOCALAPPDATA%\\Spotify"
[targets.discovery]
type = "config"
file = "%APPDATA%\\Spotify\\prefs"
format = "prefs"
key = "storage.path"
fallback = "%LOCALAPPDATA%\\Spotify\\Data"

[requirements]
process_closed = "Spotify.exe"
requires_admin = false
