id = "spotify"
name = "Spotify Cache"
category = "applications"
description = "Cached music streaming data, browser UI cache, and offline content for the Microsoft Store version of Spotify."
safety = "Safe"

# Read from Win32 prefs file
[[targets]]
action = "DeleteContents"
[targets.discovery]
Strategy = "Config"
file = "%APPDATA%\\Spotify\\prefs"
format = "prefs"
key = "storage.path"
fallback = "%LOCALAPPDATA%\\Spotify\\Data"

# Read from UWP prefs file
[[targets]]
action = "DeleteContents"
[targets.discovery]
Strategy = "Config"
file = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\prefs"
format = "prefs"
key = "storage.path"
fallback = "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0\\LocalCache\\Spotify\\Data"

# We should also clean the Browser cache. Since storage.path only points to Data, we can use Glob strategy as an example,
# or we can keep static paths for the Browser cache since it doesn't move with storage.path usually. 
# But the user wanted dynamic discovery for the 0 bytes one (storage.path).
[[targets]]
action = "DeleteContents"
[targets.discovery]
type = "deep_search"
base_paths = ["%LOCALAPPDATA%\\Spotify", "%LOCALAPPDATA%\\Packages\\SpotifyAB.SpotifyMusic_zpdnekdrzrea0"]
target_names = ["Data", "Storage", "Browser"]
max_depth = 4

[requirements]
process_closed = "Spotify.exe"
requires_admin = false
